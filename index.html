<style>
/* ===== Theme — swap these when brand colors arrive ===== */
:root{
  --brand:#EF8A12;        /* Ismailia Fresh orange */
  --brand-ink:#ffffff;
  --brand-soft:#FFF1DE;
  --brand-dark:#B35F00;
  --green:#8DC63F;        /* Ismailia Fresh green */
  --green-dark:#4F8A17;
  --green-soft:#EEF7E1;
  --accent:#8DC63F;
  --bg:#f5f6f4;
  --card:#ffffff;
  --ink:#1c2321;
  --muted:#66706c;
  --line:#e2e5e2;
  --ok:#4F8A17;  --ok-bg:#EEF7E1;
  --warn:#c98a00; --warn-bg:#fff3d6;
  --bad:#d23c3c;  --bad-bg:#fde5e5;
  --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand-dark)}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--card);border-inline-end:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.logo .mark{width:38px;height:38px;border-radius:10px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:700}
.logo b{display:block;font-size:15px}.logo small{color:var(--muted);font-size:12px}
nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;text-decoration:none;color:var(--ink);font-weight:500}
nav a:hover{background:var(--bg)}
nav a.on{background:var(--brand-soft);color:var(--brand-dark)}
nav svg{width:18px;height:18px;flex:none}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
main{padding:22px 26px 60px;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:22px;margin:0}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#c9cec9}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.grid{display:grid;gap:14px}
.grid>*{min-width:0}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi .l{color:var(--muted);font-size:13px}
.kpi .v{font-size:28px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .h{font-size:12px;color:var(--muted)}
.kpi.warn .v{color:var(--warn)} .kpi.bad .v{color:var(--bad)}
.two{grid-template-columns:1.3fr 1fr}
h3{margin:0 0 12px;font-size:15px}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:90px 1fr 52px;align-items:center;gap:10px;font-size:13px}
.bar .track{height:12px;background:var(--bg);border-radius:6px;overflow:hidden;display:flex}
.bar .track i{display:block;height:100%}
.bar .n{text-align:end;font-variant-numeric:tabular-nums;font-weight:600}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:start;font-weight:600;color:var(--muted);font-size:12.5px;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.chip{white-space:nowrap}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--card)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)} .b-warn{background:var(--warn-bg);color:var(--warn)} .b-bad{background:var(--bad-bg);color:var(--bad)}
.b-gray{background:var(--bg);color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
select,input[type=text],input[type=password],input[type=number],input[type=date],input[type=search],input[type=tel],textarea{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 10px;min-width:0}
select:focus,input:focus,textarea:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
.fridges{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.fridge{cursor:pointer;transition:border-color .15s}
.fridge:hover{border-color:var(--brand)}
.fridge .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.fridge .code{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.3px}
.fridge .own{font-weight:600;font-size:15.5px;margin-top:2px}
.fridge .shop{color:var(--muted);font-size:13px}
.fridge .stats{display:flex;gap:16px;margin-top:12px;font-size:13px}
.fridge .stats b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.chip{font-size:11.5px;padding:2px 8px;border-radius:6px;background:var(--bg)}
.muted{color:var(--muted)}
.maps{grid-template-columns:1fr 1fr}
.map>svg{width:100%;height:auto;display:block;border-radius:10px}
.pin{cursor:pointer}
.pin:hover circle.c{r:11}
.mapinfo{margin-top:12px;min-height:84px}
.modal-bg{position:fixed;inset:0;background:rgba(20,25,23,.42);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal-bg.show{display:flex}
.modal{background:var(--card);border-radius:14px;width:min(560px,100%);max-height:90vh;overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal.wide{width:min(860px,100%)}
.modal h2{margin:0 0 14px;font-size:18px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500}
.form .full{grid-column:1/-1}
.form-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.sizes{display:flex;flex-wrap:wrap;gap:8px}
.szopt{cursor:pointer}
.szopt input{position:absolute;opacity:0;pointer-events:none}
.szopt span{display:inline-block;padding:7px 14px;border:1px solid var(--line);border-radius:9px;font-weight:500;user-select:none}
.szopt input:checked+span{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.szopt input:focus-visible+span{outline:2px solid var(--brand-soft)}
.hint{font-size:12px;color:var(--muted);font-weight:400}
.toast{position:fixed;bottom:20px;inset-inline-start:50%;transform:translateX(50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
[dir=ltr] .toast{transform:translateX(-50%)}
.toast.show{opacity:1}
.drop{border:2px dashed var(--line);border-radius:var(--radius);padding:28px;text-align:center;background:var(--card);cursor:pointer}
.drop.over{border-color:var(--brand);background:var(--brand-soft)}
.err{color:var(--bad);font-size:12.5px}
code.csv{display:block;white-space:pre;overflow:auto;background:var(--bg);padding:12px;border-radius:9px;font-size:12.5px;direction:ltr;text-align:left}
.empty{padding:30px;text-align:center;color:var(--muted)}
.mobile-nav{display:none}
.brandlogo{display:block;height:auto}
.logo img{width:150px}
.devby{font-size:11.5px;color:var(--muted);text-align:center;padding-top:6px}
.devby b{color:var(--brand-dark);font-weight:600}
.mfoot{display:none}
html.modal-open,html.modal-open body{overflow:hidden}
.modal-bg{overscroll-behavior:contain}
.modal{position:relative;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.mclose{position:sticky;top:0;float:inline-end;z-index:3;width:38px;height:38px;margin:-8px -8px 0 8px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:22px;line-height:1;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.mclose:hover{background:var(--bg)}
.form>*{min-width:0}
.form select,.form input,.form textarea{width:100%;min-width:0;max-width:100%}
.form .row{flex-wrap:nowrap}
.form .row select{width:auto;flex:none}
.mclose{box-shadow:0 2px 10px rgba(0,0,0,.12)}
input,select,textarea{font-size:16px}
/* login */
#login{display:none;min-height:100vh;min-height:100dvh;align-items:center;justify-content:center;padding:20px;background:radial-gradient(900px 500px at 85% -10%,var(--brand-soft),transparent),radial-gradient(800px 500px at 0% 110%,var(--green-soft),transparent),var(--bg)}
body.locked #login{display:flex} body.locked .app,body.locked .mobile-nav{display:none!important}
.lcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;width:min(440px,100%);box-shadow:0 20px 60px rgba(0,0,0,.08)}
.lcard .mark{width:52px;height:52px;border-radius:14px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:700;font-size:20px;margin:0 auto 10px}
.lcard h1{text-align:center;font-size:20px}.lcard .sub{text-align:center}
.lcard form{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.lcard input{width:100%}
.demo-tag{display:inline-block;background:var(--warn-bg);color:#7a5600;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px}
.acc{display:flex;align-items:center;gap:10px;width:100%;text-align:start;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px;cursor:pointer}
.acc:hover{border-color:var(--brand)}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:none}
.userbox{display:flex;align-items:center;gap:9px;padding:9px;border:1px solid var(--line);border-radius:10px}
.userbox b{font-size:13px;display:block;line-height:1.3}.userbox small{color:var(--muted);font-size:11.5px}
/* role gating */
body.r-viewer [data-act="addStock"],body.r-viewer [data-act="withdraw"],body.r-viewer [data-act="addFridge"],body.r-viewer [data-act="addProduct"],body.r-viewer [data-act="reset"],
body.r-store [data-act="addFridge"],body.r-store [data-act="addProduct"],body.r-store [data-act="reset"],
body.r-viewer [data-act="exportStock"],body.r-viewer [data-act="exportMoves"],body.r-viewer [data-act="template"]{display:none!important}
body:not(.r-admin) [data-chg="policy"],body:not(.r-admin) [data-chg="warnDays"]{pointer-events:none;opacity:.55}
.feed{display:flex;flex-direction:column}
.feed .it{display:flex;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);align-items:flex-start}
.feed .it:last-child{border-bottom:0}
.feed .tm{color:var(--muted);font-size:12px;margin-top:2px}
.lmap{height:360px;border-radius:10px;z-index:0}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  aside{display:none}
  .mobile-nav{display:flex;position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto;padding:6px;gap:4px}
  .mobile-nav a{flex:none;padding:7px 11px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:13.5px;font-weight:500}
  .mobile-nav a.on{background:var(--brand-soft);color:var(--brand-dark)}
  main{padding:16px 14px 50px}
  .kpis{grid-template-columns:1fr 1fr}
  .two,.maps{grid-template-columns:1fr}
  .form{grid-template-columns:1fr}
  .card table{display:block;overflow-x:auto}
  .modal-bg{padding:0;align-items:flex-end}
  .modal,.modal.wide{width:100%;max-height:92vh;max-height:92dvh;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
  .mobile-nav .mlogo{flex:none;display:flex;align-items:center;padding:0 6px}
  .mobile-nav .mlogo img{height:30px;width:auto}
  .mfoot{display:block;margin-top:28px}
}
</style>

function mapSVG(area){
  const fs=S.fridges.filter(f=>f.area===area);
  const W=520,H=360,pad=0.012;
  const lats=fs.map(f=>f.lat),lngs=fs.map(f=>f.lng);
  let la0=Math.min(...lats)-pad,la1=Math.max(...lats)+pad,lo0=Math.min(...lngs)-pad,lo1=Math.max(...lngs)+pad;
  // keep aspect
  const sx=(lo1-lo0)/W,sy=(la1-la0)/H,s=Math.max(sx,sy);const cx=(lo0+lo1)/2,cy=(la0+la1)/2;
  lo0=cx-s*W/2;lo1=cx+s*W/2;la0=cy-s*H/2;la1=cy+s*H/2;
  const X=lng=>(lng-lo0)/(lo1-lo0)*(W-50)+8,Y=lat=>H-12-(lat-la0)/(la1-la0)*(H-40);
  const wl=area==="hrg"?(lang==="ar"?"البحر الأحمر":"Red Sea"):(lang==="ar"?"قناة السويس":"Suez Canal");
  const water=`<rect x="${W-34}" y="0" width="34" height="${H}" fill="#cfe6f2"/><text x="${W-12}" y="${H/2}" fill="#6b9ab3" font-size="12" text-anchor="middle" transform="rotate(90 ${W-12} ${H/2})">${wl}</text>`;
  const grid=[1,2,3,4,5].map(i=>`<line x1="${W*i/6}" y1="0" x2="${W*i/6}" y2="${H}" stroke="#e7ebe7"/><line x1="0" y1="${H*i/6}" x2="${W}" y2="${H*i/6}" stroke="#e7ebe7"/>`).join("");
  const pins=fs.map(f=>{const w=worstOf(f.code);const x=X(f.lng),y=Y(f.lat);const sel=mapSel===f.code;
    return `<g class="pin" data-act="mapPin" data-code="${f.code}"><circle cx="${x}" cy="${y}" r="${sel?16:13}" fill="${statusColor(w)}" opacity=".18"/><circle class="c" cx="${x}" cy="${y}" r="${sel?10:8}" fill="${statusColor(w)}" stroke="#fff" stroke-width="2.5"/>
      <text x="${x}" y="${y-15}" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1c2321">${f.code}</text></g>`}).join("");
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="direction:ltr"><rect width="${W}" height="${H}" fill="#f7f8f5"/>${grid}${water}${pins}</svg>`;
}

function parseCSV(text){
  text=text.replace(/^﻿/,"");const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
    else if(c==='"')q=true;else if(c===","||c===";"||c==="\t"){row.push(cell);cell=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(cell);if(row.some(x=>x.trim()!==""))rows.push(row);row=[];cell=""}
    else cell+=c}
  row.push(cell);if(row.some(x=>x.trim()!==""))rows.push(row);return rows;
}
function normDate(s){s=String(s||"").trim().replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));let m;
  if(m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/))return iso(m[1],m[2],m[3]);
  if(m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/))return iso(m[3],m[2],m[1]);return null;
  function iso(y,mo,d){const dt=new Date(Date.UTC(+y,+mo-1,+d));if(dt.getUTCMonth()!==+mo-1)return null;return dt.toISOString().slice(0,10)}}
function resolveFridge(v){v=String(v||"").trim().toLowerCase();if(!v)return null;
  return S.fridges.find(f=>[f.code,f.ownerAr,f.ownerEn,f.shopAr,f.shopEn].some(x=>String(x).trim().toLowerCase()===v))||null}
function resolveSku(sku,product,size){const m=skuMap();if(sku){const k=String(sku).trim().toUpperCase();if(m[k])return k}
  if(product){const pv=String(product).trim().toLowerCase();const sz=String(size||"").replace(/[^\d.]/g,"");
    const p=S.products.find(p=>[p.code,p.nameAr,p.nameEn,p.nameAr.replace(/^عصير /,""),p.nameEn.replace(/ Juice$/i,"")].some(x=>x.toLowerCase()===pv));
    if(p){const raw=String(size||"").toLowerCase().replace(/\s/g,"");const u=/(لتر|liter|litre|l$)/.test(raw)?"L":/(طن|ton|t$)/.test(raw)?"T":/(كجم|كيلو|kg)/.test(raw)?"kg":null;
      const v=p.variants.find(v=>v.size===+sz&&(!u||v.unit===u));if(v)return v.sku}}return null}
function analyzeCSV(text){
  const rows=parseCSV(text);if(!rows.length)return [];
  const H=rows[0].map(h=>h.trim().toLowerCase().replace(/\s+/g,"_"));
  const col=names=>H.findIndex(h=>names.includes(h));
  const ci={fridge:col(["fridge","fridge_code","التلاجة","تلاجة"]),sku:col(["sku"]),product:col(["product","المنتج","منتج"]),size:col(["size","الحجم","حجم"]),
    qty:col(["qty","quantity","الكمية","كمية"]),prod:col(["production_date","prod","تاريخ_الإنتاج","تاريخ_الانتاج"]),exp:col(["expiry_date","exp","expiry","تاريخ_الانتهاء"]),lot:col(["lot","lot_no","batch_no","run","رقم_التشغيلة","التشغيلة","رقم_اللوط"])};
  return rows.slice(1).map((r,i)=>{const g=k=>ci[k]>=0?(r[ci[k]]||"").trim():"";const errs=[];
    const f=resolveFridge(g("fridge"));if(!f)errs.push(t("e_fridge"));
    const sku=resolveSku(g("sku"),g("product"),g("size"));if(!sku)errs.push(t("e_sku"));
    const qty=Number(String(g("qty")).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)));if(!(qty>0)||!Number.isInteger(qty))errs.push(t("e_qty"));
    const prod=normDate(g("prod")),exp=normDate(g("exp"));if(!prod||!exp)errs.push(t("e_date"));else if(exp<prod)errs.push(t("e_order"));
    return {line:i+2,raw:{fridge:g("fridge"),sku:g("sku")||[g("product"),g("size")].filter(Boolean).join(" "),qty:g("qty"),prod:g("prod"),exp:g("exp")},fridge:f&&f.code,sku,qty,prod,exp,lot:g("lot")||(sku&&prod?autoLot(sku,prod):""),errs}});
}

    ${list.map((b,i)=>`<tr style="${i===0?"background:var(--brand-soft)":""}"><td class="muted">${b.id}</td><td>${lotChip(b.lot)}</td><td class="num">${b.entry}</td><td class="num">${b.exp}</td><td class="num"><b>${fmt(b.qty)}</b> <span class="muted">(${wt(kgOf(b.sku,b.qty))})</span></td><td>${lifeBar(b)}</td><td>${badge(b.exp)}</td>
    <td>${i===0?`<span class="badge" style="background:var(--brand);color:var(--brand-ink)">★ ${t("goesFirst")}</span>`:""}</td></tr>`).join("")}</table></div></div>`}).join("");
  modal(`<div class="row" style="justify-content:space-between;margin-bottom:6px"><div><div class="muted" style="font-size:12px;font-weight:600">${f.code} · ${t(f.area)}</div><h2 style="margin:2px 0">${esc(L(f,"owner"))}</h2>
   <div class="muted" style="font-size:13px">${esc(L(f,"shop"))} — ${esc(L(f,"addr"))} · <span dir="ltr">${esc(f.phone)}</span></div></div>
   <div class="row"><a class="btn sm" href="https://www.google.com/maps?q=${f.lat},${f.lng}" target="_blank" rel="noopener">📍 ${t("openMaps")}</a></div></div>
   ${capBar(f)}
   <div class="row" style="margin:12px 0"><button class="btn pri sm" data-act="addStock" data-code="${code}">＋ ${t("addStock")}</button><button class="btn sm" data-act="withdraw" data-fr="${code}">⚡ ${t("auto")}</button><span class="muted" style="font-size:12.5px">${t("policy")}: <b>${S.policy==="fifo"?"FIFO":"FEFO"}</b></span></div>
   <h3>${t("fridgeStock")}</h3>${bs.length?gHtml:`<div class="empty">${t("noStock")}</div>`}
   <h3 style="margin-top:16px">${t("lastMoves")}</h3><div class="chips">${mv.map(m=>`<span class="chip">${m.date} · ${t("t_"+m.type)} · ${esc(prodName(m.sku).replace(/^عصير /,""))} ${esc(sizeName(m.sku))} · ${m.type==="in"?"+":"−"}${fmt(m.qty)}</span>`).join("")}</div>
   <div class="form-foot"><button class="btn" data-act="closeModal">${t("close")}</button></div>`,true)}

function mLot(lot){const bs=S.batches.filter(b=>b.lot===lot);const ids=new Set(bs.map(b=>b.id));
  const ins=id=>S.moves.filter(m=>m.batch===id&&m.type==="in").reduce((s,m)=>s+m.qty,0);
  const liveF=new Set(bs.filter(b=>b.qty>0).map(b=>b.fridge));const b0=bs[0];
  const mv=S.moves.filter(m=>ids.has(m.batch)).slice().reverse();
  modal(`<div class="muted" style="font-size:12px;font-weight:600">${t("lotTrace")}</div><h2 style="margin:2px 0 4px" dir="ltr">${esc(lot)}</h2>
   ${b0?`<div class="muted" style="font-size:13px;margin-bottom:12px">${esc(prodName(b0.sku))} · ${t("prod")} ${b0.prod} · ${t("exp")} ${b0.exp} · ${t("inN",{n:fmt(liveF.size)})}</div>`:""}
   <div class="tbl-wrap"><table><tr><th>${t("batch")}</th><th>${t("fridge")}</th><th>${t("size")}</th><th>${t("entered")}</th><th>${t("current")}</th><th>${t("weight")}</th><th>${t("status")}</th></tr>
   ${bs.map(b=>{const f=fridgeBy(b.fridge);return `<tr><td class="muted">${b.id}</td><td><a href="#" data-act="fridgeDetail" data-code="${f.code}"><b>${esc(L(f,"owner"))}</b></a> <span class="muted" style="font-size:12px">${f.code} · ${t(f.area)}</span></td><td>${esc(sizeName(b.sku))}</td><td class="num">${fmt(ins(b.id))}</td><td class="num"><b>${fmt(b.qty)}</b></td><td class="num">${wt(kgOf(b.sku,b.qty))}</td><td>${b.qty?badge(b.exp):`<span class="badge b-gray">✓ ${t("finished")}</span>`}</td></tr>`}).join("")}</table></div>
   <h3 style="margin-top:16px">${t("lastMoves")}</h3><div class="chips">${mv.slice(0,12).map(m=>`<span class="chip">${m.date} · ${t("t_"+m.type)} · ${m.fridge} · ${m.type==="in"?"+":"−"}${fmt(m.qty)}</span>`).join("")}</div>
   <div class="form-foot"><button class="btn" data-act="closeModal">${t("close")}</button></div>`,true)}
function sizeChips(u){const def=u==="kg"?[3,5,10]:[];return UNITS[u].presets.map(k=>`<label class="szopt"><input type="checkbox" name="size" value="${k}" ${def.includes(k)?"checked":""}><span>${fmt(k)} ${UNITS[u][lang]}</span></label>`).join("")}
function submitForm(name){
  const form=document.querySelector(`[data-form="${name}"]`);const d=Object.fromEntries(new FormData(form).entries());const err=m=>document.getElementById("fErr").textContent=m;
  if(name==="addStock"){let qty=parseFloat(d.qty);if(!d.fridge||!d.sku||!(qty>0)||!d.prod||!d.exp)return err(t("required"));if(d.exp<d.prod)return err(t("e_order"));
    if(d.qu==="kg"){const pk=packKg(d.sku);const u=qty/pk;if(Math.abs(u-Math.round(u))>1e-6)return err(t("notMultiple",{n:wt(pk)}));qty=Math.round(u)}else if(!Number.isInteger(qty))return err(t("e_qty"));
    const id="B"+String(S.nb++).padStart(4,"0");S.batches.push({id,fridge:d.fridge,sku:d.sku,qty,prod:d.prod,exp:d.exp,entry:todayISO(),lot:(d.lot||"").trim()||autoLot(d.sku,d.prod)});
    S.moves.push({ts:nowTs(),user:SES&&SES.u,id:S.nm++,date:todayISO(),type:"in",fridge:d.fridge,sku:d.sku,batch:id,qty,note:d.note||""});toast(t("saved"))}
  if(name==="withdraw"){const {u,err:e2}=wdUnits();if(e2)return err(e2);if(!u)return err(t("required"));const date=wd.date||todayISO(),pol=S.policy==="fifo"?"FIFO":"FEFO";
    if(wd.mode==="auto"){const a=allocate(wd.fr,wd.sku,u);if(a.short)return err(t("shortBy",{n:fmt(a.avail)}));
      a.out.forEach(x=>{x.b.qty-=x.take;S.moves.push({ts:nowTs(),user:SES&&SES.u,id:S.nm++,date,type:wd.type,fridge:x.b.fridge,sku:x.b.sku,batch:x.b.id,qty:x.take,note:[`⚡ ${pol}`,wd.note].filter(Boolean).join(" · ")})})}
    else{const b=S.batches.find(x=>x.id===wd.batch);if(!b)return err(t("required"));if(u>b.qty)return err(t("overQty")+` (${b.qty})`);
      const old=olderOf(b);if(old.length&&!wd.note.trim())return err(t("reasonReq"));
      b.qty-=u;S.moves.push({ts:nowTs(),user:SES&&SES.u,id:S.nm++,date,type:wd.type,fridge:b.fridge,sku:b.sku,batch:b.id,qty:u,note:old.length?`⚠ ${t("offOrder")}: ${wd.note}`:wd.note})}
    toast(t("withdrawn"))}
  if(name==="addFridge"){if(!d.ownerAr)return err(t("required"));const n=S.fridges.filter(f=>f.area===d.area).length+1;let code=`${d.area==="ism"?"ISM":"HRG"}-${String(n).padStart(2,"0")}`;
    while(fridgeBy(code))code=code.replace(/\d+$/,x=>String(+x+1).padStart(2,"0"));
    const base=d.area==="ism"?[30.60,32.27]:[27.21,33.83];const lat=parseFloat(d.lat),lng=parseFloat(d.lng);
    logAct("addFridge",{c:code});S.fridges.push({code,area:d.area,ownerAr:d.ownerAr,ownerEn:d.ownerEn||d.ownerAr,shopAr:d.shopAr||"",shopEn:d.shopEn||d.shopAr||"",addrAr:d.addrAr||"",addrEn:d.addrAr||"",phone:d.phone||"",cap:parseFloat(d.cap)||0,
      lat:isFinite(lat)?lat:base[0]+(Math.random()-.5)*.03,lng:isFinite(lng)?lng:base[1]+(Math.random()-.5)*.03});toast(t("saved")+" · "+code)}
  if(name==="addProduct"){const code=(d.code||"").trim().toUpperCase();if(!d.nameAr||!code)return err(t("required"));if(S.products.some(p=>p.code===code))return err(t("code")+" ✕");
    const unit=d.unit||"kg";const sizes=[...form.querySelectorAll('input[name="size"]:checked')].map(x=>+x.value);if(parseFloat(d.custom)>0&&!sizes.includes(+d.custom))sizes.push(+d.custom);sizes.sort((a,b)=>a-b);if(!sizes.length)return err(t("required"));
    logAct("addProduct",{c:code});S.products.push({code,nameAr:d.nameAr,nameEn:d.nameEn||d.nameAr,color:"#1f6f5c",variants:sizes.map(k=>mkVariant(code,k,unit))});toast(t("saved"))}
  persist();closeModal();render();
}

/* ================= Events ================= */
document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-act]");if(!el)return;const a=el.dataset.act;
  if(SES&&GUARDED.includes(a)&&!can(a)){e.preventDefault();return toast(t("noPerm"))}
  if(a==="demoLogin"){return doLogin(el.dataset.u,"1234")}
  if(a==="logout"){logAct("logout");persist();SES=null;try{localStorage.removeItem(KEY+"-ses")}catch(x){}closeModal();return render()}
  if(el.tagName==="A"&&(a==="lang"||a==="logout"))e.preventDefault();
  if(a==="lang"){lang=lang==="ar"?"en":"ar";try{localStorage.setItem(KEY+"-lang",lang)}catch(x){}csvRows&&(csvRows=null);render()}
  else if(a==="reset"){modal(`<h2>${t("reset")}</h2><p>${t("confirmReset")}</p><div class="form-foot"><button class="btn" data-act="closeModal">${t("cancel")}</button><button class="btn pri" data-act="doReset">${t("yes")}</button></div>`)}
  else if(a==="doReset"){S=seed();logAct("reset");persist();filt={area:"",fridge:"",product:"",status:"",q:""};mapSel=null;csvRows=null;closeModal();render()}
  else if(a==="closeModal")closeModal();
  else if(a==="addStock")mAddStock(el.dataset.code);
  else if(a==="withdraw"){e.preventDefault();mWithdraw(el.dataset.batch,el.dataset.fr)}
  else if(a==="lot"){e.preventDefault();mLot(el.dataset.lot)}
  else if(a==="prodMoves"){filt={area:"",fridge:"",product:el.dataset.p,status:"",q:""};location.hash="moves";render()}
  else if(a==="addFridge")mAddFridge();
  else if(a==="addProduct")mAddProduct();
  else if(a==="fridgeDetail"){e.preventDefault();mFridgeDetail(el.dataset.code)}
  else if(a==="mapPin"){mapSel=el.dataset.code;render()}
  else if(a==="submit")submitForm(el.dataset.f);
  else if(a==="pickFile")document.getElementById("fileIn").click();
  else if(a==="previewPaste"){const v=document.getElementById("pasteBox").value;if(v.trim()){csvRows=analyzeCSV(v);render()}}
  else if(a==="doImport"){const ok=csvRows.filter(r=>!r.errs.length);logAct("import",{n:ok.length});ok.forEach(r=>{const id="B"+String(S.nb++).padStart(4,"0");
      S.batches.push({id,fridge:r.fridge,sku:r.sku,qty:r.qty,prod:r.prod,exp:r.exp,entry:todayISO(),lot:r.lot});S.moves.push({ts:nowTs(),user:SES&&SES.u,id:S.nm++,date:todayISO(),type:"in",fridge:r.fridge,sku:r.sku,batch:id,qty:r.qty,note:"CSV"})});
      persist();csvRows=null;toast(t("imported",{n:fmt(ok.length)}));location.hash="stock";render()}
  else if(a==="template")offerFile("ismailia-fresh-stock-template.csv",templateCSV());
  else if(a==="exportStock"){const rows=fbOrdered().map(b=>{const f=fridgeBy(b.fridge);return [b.id,b.lot||"",f.code,f.ownerAr,f.ownerEn,t(f.area),b.sku,prodName(b.sku),sizeName(b.sku),b.qty,kgOf(b.sku,b.qty),b.entry,b.prod,b.exp,daysBetween(todayISO(),b.exp),t(status(b.exp))]});
      offerFile(`stock-${todayISO()}.csv`,toCSV([["batch","lot","fridge","owner_ar","owner_en","area","sku","product","size","qty","weight_kg","entry_date","production_date","expiry_date","days_left","status"],...rows]))}
  else if(a==="exportMoves"){offerFile(`movements-${todayISO()}.csv`,toCSV([["date","type","fridge","sku","product","size","qty","batch","note"],...S.moves.map(m=>[m.date,m.type,m.fridge,m.sku,prodName(m.sku),sizeName(m.sku),m.qty,m.batch,m.note])]))}
  else if(a==="copyTa"){const ta=document.getElementById("cpy");try{await navigator.clipboard.writeText(ta.value);toast(t("copied"))}catch(x){ta.select()}}
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.actUser){actUser=el.value;return render()}
  if(el.dataset.sort){stockSort=el.value;return render()}
  if(el.dataset.filt){filt[el.dataset.filt]=el.value;if(el.dataset.filt==="area")filt.fridge="";render()}
  else if(el.dataset.chg==="warnDays"){if(role()!=="admin"){toast(t("noPerm"));return render()}S.warnDays=+el.value;logAct("warnDays",{v:S.warnDays});persist();render()}
  else if(el.dataset.chg==="policy"){if(role()!=="admin"){toast(t("noPerm"));return render()}S.policy=el.value;logAct("policy",{v:S.policy.toUpperCase()});persist();render()}
  else if(el.dataset.wd&&wd){const k=el.dataset.wd;wd[k]=el.value;if(["mode","fr","sku","batch","qu"].includes(k)){fixWd();renderWd()}else renderWdPrev()}
  else if(el.dataset.chg==="unit"){document.getElementById("sizeBox").innerHTML=sizeChips(el.value);document.getElementById("custUnit").textContent=UNITS[el.value][lang]}
  else if(el.dataset.chg==="wdFridge"){document.getElementById("wdBatch").innerHTML=batchOpts(el.value)}
});
document.addEventListener("input",e=>{const el=e.target;if(el.dataset.wd&&wd&&["qty","note","date"].includes(el.dataset.wd)){wd[el.dataset.wd]=el.value;renderWdPrev();return}if(el.dataset.filt==="q"){filt.q=el.value;const pos=el.selectionStart;render();const n=document.querySelector('[data-filt="q"]');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}}});
document.getElementById("modalBg").addEventListener("click",e=>{if(e.target.id==="modalBg")closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
function readFile(file){if(!file)return;const r=new FileReader();r.onload=()=>{csvRows=analyzeCSV(String(r.result));if(route()!=="import")location.hash="import";render()};r.readAsText(file,"utf-8")}
document.getElementById("fileIn").addEventListener("change",e=>{readFile(e.target.files[0]);e.target.value=""});
document.addEventListener("dragover",e=>{const d=e.target.closest&&e.target.closest("#drop");if(d){e.preventDefault();d.classList.add("over")}});
document.addEventListener("dragleave",e=>{const d=e.target.closest&&e.target.closest("#drop");if(d)d.classList.remove("over")});
document.addEventListener("drop",e=>{const d=e.target.closest&&e.target.closest("#drop");if(d){e.preventDefault();d.classList.remove("over");readFile(e.dataTransfer.files[0])}});
window.addEventListener("hashchange",()=>{filt.status="";render()});
render();
</script>
</body>
</html>
