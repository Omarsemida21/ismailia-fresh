<style>
:root{
  --or:#EF8A12; --or-d:#B35F00; --or-s:#FFF1DE; --or-xs:#FFF8EE;
  --gr:#8DC63F; --gr-d:#4F8A17; --gr-s:#EEF7E1;
  --ink:#1f2420; --muted:#6b726e; --line:#ece7df; --bg:#fffdf9; --card:#fff;
  --bad:#c93a3a; --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:15px}
h1,h2,h3,.disp{font-family:"Cairo","IBM Plex Sans Arabic",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
a{color:var(--or-d)}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
.btn{border:1px solid var(--line);background:var(--card);padding:10px 16px;border-radius:12px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:#d9d2c6}
.btn.pri{background:var(--or);border-color:var(--or);color:#fff}
.btn.pri:hover{filter:brightness(1.06)}
.btn.gr{background:var(--gr-d);border-color:var(--gr-d);color:#fff}
.btn.sm{padding:6px 11px;font-size:13.5px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
/* header */
header{position:sticky;top:0;z-index:30;background:rgba(255,253,249,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:14px;height:68px}
.hd .logo{height:44px;width:auto;display:block}
.bchip{display:flex;flex-direction:column;line-height:1.25;padding-inline-start:12px;border-inline-start:1px solid var(--line)}
.bchip b{font-family:Cairo;font-size:14.5px}
.bchip small{font-size:12px;color:var(--gr-d);font-weight:600}
.bchip small.closed{color:var(--bad)}
.hd .sp{flex:1}
.search{position:relative;flex:0 1 300px}
.search input{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 14px}
.cartbtn{position:relative}
.cartbtn .n{position:absolute;top:-6px;inset-inline-end:-6px;background:var(--gr-d);color:#fff;border-radius:999px;font-size:11.5px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 5px;font-weight:700}
/* hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--or-s),#fff 55%,var(--gr-s));border-bottom:1px solid var(--line)}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:center;padding-top:42px;padding-bottom:42px}
.hero h1{font-size:44px;line-height:1.2;margin:10px 0 12px;font-weight:800}
.hero h1 em{font-style:normal;color:var(--or)}
.hero p{font-size:17px;color:var(--muted);margin:0 0 22px;max-width:520px}
.tag{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--gr-d)}
.facts{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.fact{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:13px;color:var(--muted)}
.fact b{display:block;font-family:Cairo;font-size:16px;color:var(--ink)}
.heroart{display:flex;justify-content:center;align-items:flex-end;gap:6px;min-height:280px}
.heroart svg{filter:drop-shadow(0 18px 24px rgba(180,95,0,.18))}
/* sections */
section{padding:34px 0}
.shd{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.shd h2{margin:0;font-size:26px;font-weight:800}
.shd p{margin:4px 0 0;color:var(--muted)}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-weight:600;cursor:pointer}
.cat.on{background:var(--ink);border-color:var(--ink);color:#fff}
.offer{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;background:linear-gradient(110deg,var(--gr-d),#6aa72b);color:#fff;border-radius:22px;padding:18px 24px;margin-bottom:22px;overflow:hidden}
.offer h3{margin:0;font-size:22px}
.offer p{margin:4px 0 0;opacity:.92}
.offer .btn{background:#fff;color:var(--gr-d);border-color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(60,40,10,.08)}
.card .img{position:relative;height:190px;display:grid;place-items:center;cursor:pointer}
.badge{background:#fff;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.card .badge{position:absolute;top:10px;inset-inline-start:10px}
.badge.best{color:var(--or-d)} .badge.new{color:var(--gr-d)} .badge.season{color:#8a3a7a} .badge.out{color:var(--bad)}
.card .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{margin:0;font-size:16.5px;font-weight:700;cursor:pointer}
.card .desc{font-size:13px;color:var(--muted);margin:0;min-height:36px}
.sizes{display:flex;gap:6px;flex-wrap:wrap}
.sz{border:1px solid var(--line);background:#fff;border-radius:9px;padding:4px 10px;font-size:13px;font-weight:600;cursor:pointer}
.sz.on{border-color:var(--or);background:var(--or-xs);color:var(--or-d)}
.pr{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
.price{font-family:Cairo;font-weight:800;font-size:19px}
.price small{font-size:12.5px;font-weight:600;color:var(--muted)}
.price s{font-size:13px;color:var(--muted);font-weight:500;margin-inline-start:4px}
.step{display:inline-flex;align-items:center;border:1px solid var(--or);border-radius:12px;overflow:hidden}
.step button{border:0;background:var(--or-xs);width:34px;height:36px;font-size:18px;font-weight:700;cursor:pointer;color:var(--or-d)}
.step span{min-width:34px;text-align:center;font-weight:700}
.empty{padding:40px;text-align:center;color:var(--muted)}
/* info */
.info{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.icard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px}
.icard h3{margin:0 0 10px;font-size:17px}
.icard .row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.icard .row:last-child{border-bottom:0}
.whole{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;background:var(--ink);color:#fff;border-radius:22px;padding:26px}
.whole h2{margin:0 0 6px;font-size:24px}
.whole p{margin:0;opacity:.8}
footer{border-top:1px solid var(--line);padding:26px 0 90px;margin-top:20px;background:#fff}
.ft{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.ft img{height:46px}
.demo{display:inline-block;background:#fff3d6;color:#7a5600;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
.devby{font-size:12.5px;color:var(--muted)}
.devby b{color:var(--or-d)}
/* drawer + modal */
.ov{position:fixed;inset:0;background:rgba(25,20,10,.45);z-index:50;display:none;overscroll-behavior:contain}
.ov.show{display:block}
html.lock,html.lock body{overflow:hidden}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(430px,100%);background:#fff;z-index:51;display:flex;flex-direction:column;transform:translateX(-105%);transition:transform .25s ease;box-shadow:0 0 40px rgba(0,0,0,.15)}
[dir=ltr] .drawer{transform:translateX(105%)}
.drawer.show{transform:none!important}
.dh{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.dh h3{margin:0;font-size:19px}
.db{flex:1;overflow:auto;padding:14px 18px;overscroll-behavior:contain}
.df{border-top:1px solid var(--line);padding:14px 18px calc(14px + env(safe-area-inset-bottom))}
.x{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:22px;line-height:1;cursor:pointer;display:grid;place-items:center;flex:none}
.ci{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ci .th{width:62px;height:62px;border-radius:12px;display:grid;place-items:center}
.ci b{display:block;font-size:14.5px}
.ci small{color:var(--muted)}
.tot{display:flex;justify-content:space-between;padding:4px 0;font-size:14.5px}
.tot.big{font-family:Cairo;font-weight:800;font-size:19px;padding-top:8px}
.warn{background:var(--or-xs);border:1px solid var(--or-s);color:var(--or-d);font-size:13px;padding:8px 10px;border-radius:10px;margin:8px 0}
.form{display:grid;gap:10px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:13.5px;font-weight:600}
.form input,.form select,.form textarea{border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:#fff;width:100%}
.form input:focus,.form select:focus,.form textarea:focus,.search input:focus{outline:2px solid var(--or-s);border-color:var(--or)}
.pay{display:flex;gap:8px}
.pay label{flex:1;flex-direction:row;align-items:center;gap:8px;border:1px solid var(--line);border-radius:11px;padding:10px;cursor:pointer;font-weight:600}
.pay input{width:auto}
.err{color:var(--bad);font-size:13px}
.modal{position:fixed;z-index:52;inset-inline:0;margin:auto;top:50%;transform:translateY(-50%);width:min(760px,calc(100% - 32px));max-height:88vh;overflow:auto;background:#fff;border-radius:22px;display:none;overscroll-behavior:contain}
.modal.show{display:block}
.mgrid{display:grid;grid-template-columns:1fr 1fr}
.mgrid .img{display:grid;place-items:center;min-height:320px;border-radius:22px 0 0 22px}
[dir=rtl] .mgrid .img{border-radius:0 22px 22px 0}
.mgrid .body{padding:22px;display:flex;flex-direction:column;gap:12px}
.mgrid h2{margin:0;font-size:24px}
.mclose{position:sticky;top:12px;float:inline-end;margin:12px 12px -50px 0;z-index:3;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.done{text-align:center;padding:10px 4px}
.done .ok{width:64px;height:64px;border-radius:50%;background:var(--gr-s);color:var(--gr-d);display:grid;place-items:center;font-size:32px;margin:6px auto 10px}
.mbar{display:none}
.others{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:860px){
  .hd{height:60px;gap:10px}
  .hd .logo{height:36px}
  .search{display:none}
  .msearch{display:block!important;padding:10px 0 0}
  .hero .wrap{grid-template-columns:1fr;padding-top:24px;padding-bottom:26px}
  .hero h1{font-size:31px}
  .hero p{font-size:15.5px}
  .heroart{min-height:170px;order:-1}
  .heroart svg{height:170px;width:auto}
  .info{grid-template-columns:1fr}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .card .img{height:150px}
  .card .body{padding:10px}
  .card h3{font-size:15px}
  .card .desc{display:none}
  .price{font-size:16.5px}
  .step button{width:30px;height:34px}
  .step span{min-width:26px}
  .offer{grid-template-columns:1fr;text-align:center;padding:18px}
  .offer .art{display:none}
  .whole{grid-template-columns:1fr;text-align:center}
  .modal{top:auto;bottom:0;transform:none;width:100%;max-height:92vh;max-height:92dvh;border-radius:22px 22px 0 0}
  .mgrid{grid-template-columns:1fr}
  .mgrid .img{min-height:220px;border-radius:22px 22px 0 0!important}
  .mbar{display:flex;position:fixed;bottom:0;inset-inline:0;z-index:40;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);border-top:1px solid var(--line);backdrop-filter:blur(8px)}
  .mbar .btn{width:100%;justify-content:space-between}
}
</style>
</head>

function branchHref(k){return /\/(ismailia|hurghada)\/?(index\.html)?$/.test(location.pathname)?`../${k}/`:`#${k}`}
function renderGrid(){const g=document.getElementById("grid");if(!g)return;const qq=q.trim().toLowerCase();
  const list=P.filter(p=>(cat==="all"||p.cat===cat)&&(!qq||(p.ar+" "+p.en).toLowerCase().includes(qq)));
  g.innerHTML=list.map(card).join("")||`<div class="empty" style="grid-column:1/-1">—</div>`}
function card(p){const vi=sel[p.id]||0;const out=isOut(p);const n=qtyOf(p.id,vi);
  const badge=out?`<span class="badge out">${t("b_out")}</span>`:p.badge?`<span class="badge ${p.badge}">${t("b_"+p.badge)}</span>`:"";
  return `<div class="card" style="${out?"opacity:.6":""}"><div class="img" style="background:${bgOf(p)}" data-act="open" data-id="${p.id}">${badge}${art(p,160,"c")}</div>
  <div class="body"><h3 data-act="open" data-id="${p.id}">${esc(N(p))}</h3><p class="desc">${esc(lang==="ar"?p.dAr:p.dEn)}</p>
  ${p.v.length>1?`<div class="sizes">${p.v.map((v,i)=>`<button class="sz ${i===vi?"on":""}" data-act="size" data-id="${p.id}" data-vi="${i}">${esc(vName(p,i))}</button>`).join("")}</div>`:`<div class="sizes"><span class="sz on" style="cursor:default">${esc(vName(p,0))}</span></div>`}
  <div class="pr"><span class="price">${money(p.v[vi][2])}${p.was?`<s>${fmt(p.was)}</s>`:""}</span>${out?`<span style="font-size:12.5px;color:var(--bad);font-weight:700">${t("b_out")}</span>`:n?stepper(p.id,vi,n):`<button class="btn pri sm" data-act="add" data-id="${p.id}" data-vi="${vi}">＋ ${t("add")}</button>`}</div></div></div>`}
const stepper=(id,vi,n)=>`<span class="step"><button data-act="dec" data-id="${id}" data-vi="${vi}" aria-label="-">−</button><span>${fmt(n)}</span><button data-act="inc" data-id="${id}" data-vi="${vi}" aria-label="+">+</button></span>`;
function renderCartUI(){document.getElementById("cartN").textContent=fmt(count());
  const mb=document.getElementById("mbar");mb.innerHTML=count()?`<button class="btn pri" data-act="openCart"><span>${t("view")} · ${fmt(count())} ${t("items")}</span><span class="disp" style="font-weight:800">${fmt(sub())} ${t("egp")}</span></button>`:"";mb.style.visibility=count()?"visible":"hidden";
  if(document.getElementById("drawer").classList.contains("show"))renderDrawer();
  if(document.getElementById("modal").classList.contains("show")&&openId)renderModal(openId)}
/* drawer */
function renderDrawer(){const d=document.getElementById("drawer");
  if(step==="done"&&order){d.innerHTML=`<div class="dh"><h3>${t("cart")}</h3><button class="x" data-act="closeAll" aria-label="close">×</button></div><div class="db"><div class="done"><div class="ok">✓</div><h3 class="disp" style="margin:0 0 4px">${t("doneT")}</h3><div class="devby">${t("doneP")} <b dir="ltr">#${order.no}</b></div>
    <div style="text-align:start;margin-top:16px">${order.lines.map(l=>`<div class="tot"><span>${l.q} × ${esc(l.n)}</span><span>${fmt(l.p)} ${t("egp")}</span></div>`).join("")}<div class="tot"><span>${t("delivery")}</span><span>${fmt(order.fee)} ${t("egp")}</span></div><div class="tot big"><span>${t("total")}</span><span>${fmt(order.total)} ${t("egp")}</span></div></div>
    <div class="warn" style="text-align:start">${t("doneNote")}</div></div></div>
    <div class="df" style="display:grid;gap:8px"><a class="btn gr" href="${order.wa}" target="_blank" rel="noopener">${t("sendWa")}</a><button class="btn" data-act="newOrder">${t("newOrder")}</button></div>`;return}
  const head=`<div class="dh"><h3>${step==="form"?t("details"):t("cart")}</h3><button class="x" data-act="closeAll" aria-label="close">×</button></div>`;
  if(!cart.length){d.innerHTML=head+`<div class="db"><div class="empty">🥤<br>${t("emptyCart")}</div></div>`;return}
  const f=fee(),s=sub(),below=s<B.min;
  const totals=`<div class="tot"><span>${t("subtotal")}</span><span>${fmt(s)} ${t("egp")}</span></div><div class="tot"><span>${t("delivery")}</span><span>${f==null?"—":fmt(f)+" "+t("egp")}</span></div><div class="tot big"><span>${t("total")}</span><span>${fmt(s+(f||0))} ${t("egp")}</span></div>`;
  if(step==="form"){d.innerHTML=head+`<div class="db"><form class="form" id="coForm" onsubmit="return false">
    <label>${t("name")}<input name="name" autocomplete="name" required></label>
    <label>${t("phoneF")}<input name="phone" type="tel" inputmode="tel" dir="ltr" autocomplete="tel" placeholder="01xxxxxxxxx" required></label>
    <label>${t("area")}<select name="area" data-area="1"><option value="">—</option>${B.areas.map(a=>`<option value="${esc(a[1])}" ${area===a[1]?"selected":""}>${esc(lang==="ar"?a[0]:a[1])} · ${fmt(a[2])} ${t("egp")}</option>`).join("")}</select></label>
    <label>${t("addr")}<textarea name="addr" rows="2" required></textarea></label>
    <label>${t("notes")}<input name="notes"></label>
    <div><div style="font-size:13.5px;font-weight:600;margin-bottom:5px">${t("pay")}</div><div class="pay"><label><input type="radio" name="pay" value="cash" checked>${t("cash")}</label><label><input type="radio" name="pay" value="insta">${t("insta")}</label></div></div>
    <div class="err" id="coErr"></div></form></div>
    <div class="df">${totals}<div style="display:grid;grid-template-columns:auto 1fr;gap:8px;margin-top:10px"><button class="btn" data-act="back">${t("back")}</button><button class="btn pri" data-act="confirm">${t("confirm")}</button></div></div>`;return}
  d.innerHTML=head+`<div class="db">${cart.map(c=>{const p=prod(c.id);return `<div class="ci"><div class="th" style="background:${bgOf(p)}">${art(p,54,"d")}</div><div><b>${esc(N(p))}</b><small>${esc(vName(p,c.vi))} · ${fmt(p.v[c.vi][2])} ${t("egp")}</small></div>${stepper(c.id,c.vi,c.qty)}</div>`}).join("")}</div>
   <div class="df"><label class="form" style="margin-bottom:8px"><span style="font-size:13px;font-weight:600">${t("area")}</span><select data-area="1" style="border:1px solid var(--line);border-radius:11px;padding:9px 12px;background:#fff"><option value="">${t("chooseArea")}</option>${B.areas.map(a=>`<option value="${esc(a[1])}" ${area===a[1]?"selected":""}>${esc(lang==="ar"?a[0]:a[1])} · ${fmt(a[2])} ${t("egp")}</option>`).join("")}</select></label>
   ${totals}${below?`<div class="warn">${t("belowMin",{n:fmt(B.min),r:fmt(B.min-s)})}</div>`:""}<button class="btn pri" style="width:100%;margin-top:10px" data-act="toForm" ${below?"disabled":""}>${t("checkout")}</button></div>`}
/* modal */
let openId=null;
function renderModal(id){const p=prod(id),m=document.getElementById("modal");const vi=sel[id]||0,n=qtyOf(id,vi),out=isOut(p);
  m.innerHTML=`<button class="x mclose" data-act="closeAll" aria-label="close">×</button><div class="mgrid"><div class="img" style="background:${bgOf(p)}">${art(p,250,"m")}</div><div class="body">
   ${p.badge&&!out?`<span class="badge ${p.badge}" style="position:static;align-self:flex-start;border:1px solid var(--line)">${t("b_"+p.badge)}</span>`:""}
   <h2>${esc(N(p))}</h2><p style="margin:0;color:var(--muted)">${esc(lang==="ar"?p.dAr:p.dEn)}</p>
   <div class="sizes">${p.v.map((v,i)=>`<button class="sz ${i===vi?"on":""}" data-act="size" data-id="${p.id}" data-vi="${i}">${esc(vName(p,i))} · ${fmt(v[2])} ${t("egp")}</button>`).join("")}</div>
   <div class="pr" style="margin-top:8px"><span class="price">${money(p.v[vi][2])}${p.was?`<s>${fmt(p.was)}</s>`:""}</span>${out?`<span class="err">${t("unavailable")}</span>`:n?stepper(p.id,vi,n):`<button class="btn pri" data-act="add" data-id="${p.id}" data-vi="${vi}">＋ ${t("add")}</button>`}</div>
   <div class="devby">${t("demoPrices")}</div></div></div>`}
function lock(on){document.documentElement.classList.toggle("lock",on);document.getElementById("ov").classList.toggle("show",on)}
function openCart(){document.getElementById("modal").classList.remove("show");openId=null;step=order&&step==="done"?"done":"cart";renderDrawer();document.getElementById("drawer").classList.add("show");lock(true)}
function closeAll(){document.getElementById("drawer").classList.remove("show");document.getElementById("modal").classList.remove("show");openId=null;lock(false);if(step==="done"){step="cart";order=null}}
/* cart ops */
function addTo(id,vi,d){const p=prod(id);if(!p||isOut(p))return;const c=cart.find(x=>x.id===id&&x.vi===vi);if(c){c.qty+=d;if(c.qty<=0)cart=cart.filter(x=>x!==c)}else if(d>0)cart.push({id,vi,qty:d});saveCart();renderGrid();renderCartUI()}
function confirmOrder(){const f=document.getElementById("coForm");const d=Object.fromEntries(new FormData(f).entries());const er=document.getElementById("coErr");
  if(!d.name.trim()||!d.phone.trim()||!area||!d.addr.trim()){er.textContent=t("req");return}
  const ph=d.phone.replace(/[\s-]/g,"").replace(/[٠-٩]/g,x=>"٠١٢٣٤٥٦٧٨٩".indexOf(x));if(!/^01\d{9}$/.test(ph)){er.textContent=t("badPhone");return}
  const lines=cart.map(c=>{const p=prod(c.id);return {q:c.qty,n:`${N(p)} (${vName(p,c.vi)})`,p:p.v[c.vi][2]*c.qty}});const fe=fee(),s=sub();
  const no=String(Date.now()).slice(-6);const bn=lang==="ar"?B.nameAr:B.nameEn;const ar=B.areas.find(a=>a[1]===area);
  const msg=[t("waHdr",{b:bn})+` #${no}`,"",t("waItems"),...lines.map(l=>`• ${l.q} × ${l.n} = ${l.p} ${t("egp")}`),`${t("delivery")}: ${fe} ${t("egp")}`,`${t("waTotal")}: ${s+fe} ${t("egp")}`,"",`${t("waName")}: ${d.name}`,`${t("waPhone")}: ${ph}`,`${t("waAddr")}: ${lang==="ar"?ar[0]:ar[1]} — ${d.addr}`,d.notes?`📝 ${d.notes}`:"",`${t("waPay")}: ${d.pay==="cash"?t("cash"):t("insta")}`].filter(x=>x!=="").join("\n");
  order={no,lines,fee:fe,total:s+fe,wa:"https://wa.me/?text="+encodeURIComponent(msg)};cart=[];saveCart();step="done";renderGrid();renderCartUI();renderDrawer()}
/* events */
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el)return;const a=el.dataset.act,id=el.dataset.id,vi=+el.dataset.vi;
  if(el.tagName==="A"&&(a==="toMenu"))e.preventDefault();
  if(a==="lang"){lang=lang==="ar"?"en":"ar";try{localStorage.setItem("ifs-lang",lang)}catch(x){}render();if(document.getElementById("drawer").classList.contains("show"))renderDrawer();if(openId)renderModal(openId)}
  else if(a==="cat"){cat=el.dataset.c;document.querySelectorAll(".cat").forEach(b=>b.classList.toggle("on",b.dataset.c===cat));renderGrid()}
  else if(a==="size"){sel[id]=vi;renderGrid();if(openId)renderModal(openId)}
  else if(a==="add"||a==="inc")addTo(id,vi,1);
  else if(a==="dec")addTo(id,vi,-1);
  else if(a==="open"){openId=id;renderModal(id);document.getElementById("modal").classList.add("show");lock(true);document.getElementById("modal").scrollTop=0}
  else if(a==="openCart")openCart();
  else if(a==="closeAll")closeAll();
  else if(a==="toForm"){step="form";renderDrawer()}
  else if(a==="back"){step="cart";renderDrawer()}
  else if(a==="confirm")confirmOrder();
  else if(a==="newOrder"){step="cart";order=null;closeAll()}
  else if(a==="toMenu")document.getElementById("menu").scrollIntoView({behavior:"smooth"});
  else if(a==="toInfo")document.getElementById("info").scrollIntoView({behavior:"smooth"});
});
document.addEventListener("input",e=>{if(e.target.dataset.q){q=e.target.value;document.querySelectorAll("[data-q]").forEach(i=>{if(i!==e.target)i.value=q});renderGrid()}});
document.addEventListener("change",e=>{if(e.target.dataset.area){area=e.target.value;const keep={};if(step==="form"){const f=document.getElementById("coForm");if(f)new FormData(f).forEach((v,k)=>keep[k]=v)}renderDrawer();
  if(step==="form"){const f=document.getElementById("coForm");if(f)Object.entries(keep).forEach(([k,v])=>{const i=f.elements[k];if(i&&k!=="area"&&k!=="pay")i.value=v})}}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeAll()});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(BRANCHES.includes(h)&&h!==bk){bk=h;B=BR[bk];loadCart();area="";render();scrollTo(0,0)}});
render();
</script>
</body>
</html>
